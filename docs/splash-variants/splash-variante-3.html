<!-- ============================================================= -->
<!-- WEE SPLASH — VARIANTE 3: "Minimalistisch"                      -->
<!-- Tropfen fällt, kurzer weicher Lichtblitz am Einschlag,          -->
<!-- danach nur konzentrische Ausbreitungsringe. Kein Spritzer,      -->
<!-- keine Krone — ruhig, edel, reduziert.                           -->
<!-- Loopt. Klick spielt erneut ab. Autark & kopierbar.              -->
<!--                                                                 -->
<!-- TUNING (in .v3-lake style): --v3-cycle = Gesamtdauer.           -->
<!-- Einschlagpunkt = 104,92 (viewBox-Koordinaten).                  -->
<!-- ============================================================= -->
<div class="v3-lake" style="position: relative; width: 240px; height: 240px;" title="Klick = erneut abspielen">

    <style>
        .v3-lake { --v3-cycle: 5s; cursor: pointer; }

        /* ===== 1) SEE-GRUNDWELLEN (aus See-Snippet) ===== */
        .v3-lake .v3-ring-1 { animation: v3lr1 var(--v3-cycle) alternate ease-in-out infinite; fill: #52A8B6; }
        @keyframes v3lr1 { 0%{d:path('M105,30 C155,30 180,60 180,90 C180,125 150,150 105,150 C60,150 30,125 30,90 C30,60 55,30 105,30 Z');} 100%{d:path('M105,35 C150,30 185,65 175,95 C165,125 145,145 105,145 C65,145 40,125 35,95 C30,65 60,40 105,35 Z');} }
        .v3-lake .v3-ring-2 { animation: v3lr2 var(--v3-cycle) alternate ease-in-out infinite; fill: #68BAC4; }
        @keyframes v3lr2 { 0%{d:path('M105,45 C140,45 160,70 160,90 C160,115 135,135 105,135 C70,135 50,115 50,90 C50,70 70,45 105,45 Z');} 100%{d:path('M105,40 C145,45 165,65 165,90 C165,115 140,140 105,140 C65,140 45,120 45,90 C45,65 65,35 105,40 Z');} }
        .v3-lake .v3-ring-3 { animation: v3lr3 var(--v3-cycle) alternate ease-in-out infinite; fill: #81CAD4; }
        @keyframes v3lr3 { 0%{d:path('M105,60 C125,60 140,75 140,90 C140,105 120,120 105,120 C85,120 70,105 70,90 C70,75 85,60 105,60 Z');} 100%{d:path('M105,55 C130,55 145,80 145,95 C145,110 125,125 105,125 C80,125 65,110 65,90 C65,70 80,55 105,55 Z');} }
        .v3-lake .v3-ring-4 { animation: v3lr4 var(--v3-cycle) alternate ease-in-out infinite; fill: #96D5D5; }
        @keyframes v3lr4 { 0%{d:path('M105,70 C115,70 125,80 125,90 C125,100 115,110 105,110 C95,110 85,100 85,90 C85,80 95,70 105,70 Z');} 100%{d:path('M105,75 C115,70 130,85 125,95 C120,105 110,105 105,105 C95,105 80,100 85,90 C90,80 95,80 105,75 Z');} }
        .v3-lake .v3-ring-5 { animation: v3lr5 var(--v3-cycle) alternate ease-in-out infinite; fill: #BCE8E5; }
        @keyframes v3lr5 { 0%{d:path('M105,82 C110,82 112,85 112,90 C112,95 110,98 105,98 C100,98 98,95 98,90 C98,85 100,82 105,82 Z');} 100%{d:path('M105,80 C110,82 115,88 112,92 C109,96 105,95 105,95 C100,95 95,95 97,90 C99,85 100,78 105,80 Z');} }

        /* ===== 2) FALLENDER TROPFEN ===== */
        .v3-lake .v3-drop { transform-box: fill-box; transform-origin: bottom center; animation: v3-fall var(--v3-cycle) ease-in infinite; }
        @keyframes v3-fall {
            0%   { transform: translateY(-150px) scaleY(1.15) scaleX(0.9); opacity: 0; }
            6%   { opacity: 1; }
            30%  { transform: translateY(-6px) scaleY(1.26) scaleX(0.82); opacity: 1; }
            34%  { transform: translateY(0) scaleY(0.5) scaleX(1.35); opacity: 1; }
            39%  { transform: translateY(0) scaleY(0.2) scaleX(1.45); opacity: 0; }
            100% { transform: translateY(0) scaleY(0.2) scaleX(1.45); opacity: 0; }
        }

        /* ===== 3) LICHTBLITZ am Einschlag (kurz, weich) ===== */
        .v3-lake .v3-flash {
            transform-box: view-box; transform-origin: 104px 92px;
            fill: url(#v3-flash-fill); opacity: 0;
            animation: v3-flash var(--v3-cycle) ease-out infinite;
        }
        @keyframes v3-flash {
            0%, 32% { transform: scale(0.2); opacity: 0; }
            35%     { transform: scale(0.8); opacity: 0.9; }   /* Aufblitzen */
            44%     { transform: scale(1.25); opacity: 0; }
            100%    { transform: scale(1.25); opacity: 0; }
        }

        /* ===== 4) AUSBREITUNGSRINGE (nur Ringe — der Kern der Variante) ===== */
        .v3-lake .v3-ripple { transform-box: view-box; transform-origin: 104px 92px; fill: none; stroke-linejoin: round; opacity: 0; }
        .v3-lake .v3-ra { stroke: #BCE8E5; stroke-width: 2.4; animation: v3-ripple var(--v3-cycle) cubic-bezier(0.16,1,0.3,1) infinite; }
        .v3-lake .v3-rb { stroke: #96D5D5; stroke-width: 1.9; animation: v3-ripple var(--v3-cycle) cubic-bezier(0.16,1,0.3,1) infinite; animation-delay: -0.28s; }
        .v3-lake .v3-rc { stroke: #81CAD4; stroke-width: 1.5; animation: v3-ripple var(--v3-cycle) cubic-bezier(0.16,1,0.3,1) infinite; animation-delay: -0.56s; }
        .v3-lake .v3-rd { stroke: #68BAC4; stroke-width: 1.2; animation: v3-ripple var(--v3-cycle) cubic-bezier(0.16,1,0.3,1) infinite; animation-delay: -0.84s; }
        @keyframes v3-ripple {
            0%, 33% { transform: scale(0.1); opacity: 0; }
            38%     { opacity: 0.9; }
            65%     { opacity: 0.3; }
            82%     { transform: scale(1.2); opacity: 0; }
            100%    { transform: scale(1.2); opacity: 0; }
        }

        /* ===== 5) REDUCED MOTION: ruhiges Endbild ===== */
        @media (prefers-reduced-motion: reduce) {
            .v3-lake [class*="v3-ring"], .v3-lake .v3-drop,
            .v3-lake .v3-flash, .v3-lake .v3-ripple { animation: none !important; }
            .v3-lake .v3-drop, .v3-lake .v3-flash, .v3-lake .v3-ripple { opacity: 0; }
        }
    </style>

    <svg viewBox="0 0 200 200" width="100%" height="100%">
        <defs>
            <clipPath id="v3-blob-clip">
                <path d="M 40 100 C 10 50, 70 20, 100 40 C 140 10, 190 50, 170 90 C 190 140, 150 180, 110 160 C 70 190, 20 150, 40 100 Z" />
            </clipPath>
            <filter id="v3-shadow-blur"><feGaussianBlur stdDeviation="3" /></filter>
            <radialGradient id="v3-drop-fill" cx="38%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#BCE8E5" />
                <stop offset="55%" stop-color="#68BAC4" />
                <stop offset="100%" stop-color="#4395A7" />
            </radialGradient>
            <radialGradient id="v3-flash-fill" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#EFFAF8" stop-opacity="0.95" />
                <stop offset="45%" stop-color="#BCE8E5" stop-opacity="0.6" />
                <stop offset="100%" stop-color="#BCE8E5" stop-opacity="0" />
            </radialGradient>
        </defs>

        <path d="M 40 100 C 10 50, 70 20, 100 40 C 140 10, 190 50, 170 90 C 190 140, 150 180, 110 160 C 70 190, 20 150, 40 100 Z"
              fill="none" stroke="#DDB98B" stroke-width="18" stroke-linejoin="round" />

        <g clip-path="url(#v3-blob-clip)">
            <rect width="200" height="200" fill="#4395A7" />

            <path class="v3-ring-1" d="M105,30 C155,30 180,60 180,90 C180,125 150,150 105,150 C60,150 30,125 30,90 C30,60 55,30 105,30 Z"></path>
            <path class="v3-ring-2" d="M105,45 C140,45 160,70 160,90 C160,115 135,135 105,135 C70,135 50,115 50,90 C50,70 70,45 105,45 Z"></path>
            <path class="v3-ring-3" d="M105,60 C125,60 140,75 140,90 C140,105 120,120 105,120 C85,120 70,105 70,90 C70,75 85,60 105,60 Z"></path>
            <path class="v3-ring-4" d="M105,70 C115,70 125,80 125,90 C125,100 115,110 105,110 C95,110 85,100 85,90 C85,80 95,70 105,70 Z"></path>
            <path class="v3-ring-5" d="M105,82 C110,82 112,85 112,90 C112,95 110,98 105,98 C100,98 98,95 98,90 C98,85 100,82 105,82 Z"></path>

            <!-- Ausbreitungsringe -->
            <ellipse class="v3-ripple v3-ra" cx="104" cy="92" rx="50" ry="36"></ellipse>
            <ellipse class="v3-ripple v3-rb" cx="104" cy="92" rx="50" ry="36"></ellipse>
            <ellipse class="v3-ripple v3-rc" cx="104" cy="92" rx="50" ry="36"></ellipse>
            <ellipse class="v3-ripple v3-rd" cx="104" cy="92" rx="50" ry="36"></ellipse>

            <!-- Lichtblitz -->
            <circle class="v3-flash" cx="104" cy="92" r="20"></circle>

            <!-- Innerer Uferschatten -->
            <path d="M 40 100 C 10 50, 70 20, 100 40 C 140 10, 190 50, 170 90 C 190 140, 150 180, 110 160 C 70 190, 20 150, 40 100 Z"
                  fill="none" stroke="rgba(38,62,36,0.6)" stroke-width="12" filter="url(#v3-shadow-blur)"/>
        </g>

        <!-- Fallender Tropfen -->
        <g transform="translate(104 92)">
            <path class="v3-drop" fill="url(#v3-drop-fill)" stroke="#4395A7" stroke-width="0.6"
                  d="M0,0 C5,-8 8,-11 8,-16 A8,8 0 1 0 -8,-16 C-8,-11 -5,-8 0,0 Z"></path>
            <ellipse class="v3-drop" cx="-3" cy="-17" rx="2.4" ry="3.2" fill="#EFFAF8" opacity="0.85"></ellipse>
        </g>
    </svg>

    <script>
        (function () {
            var lake = document.currentScript.closest('.v3-lake');
            if (!lake) return;
            lake.addEventListener('click', function () {
                lake.querySelectorAll('.v3-drop, .v3-flash, .v3-ripple').forEach(function (el) {
                    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
                });
            });
        })();
    </script>
</div>

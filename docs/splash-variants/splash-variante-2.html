<!-- ============================================================= -->
<!-- WEE SPLASH — VARIANTE 2: "Cartoon-Satisfying / Krone"          -->
<!-- Tropfen fällt, satter Aufschlag mit Krone (Crown-Splash),       -->
<!-- Sekundärtropfen fliegen im Bogen hoch und fallen zurück,        -->
<!-- danach Rebound-Tropfen ("Milk-Crown"), See beruhigt sich.       -->
<!-- Loopt. Klick spielt erneut ab. Autark & kopierbar.              -->
<!--                                                                 -->
<!-- TUNING (in .v2-lake style): --v2-cycle = Gesamtdauer.           -->
<!-- Einschlagpunkt = 104,92 (viewBox-Koordinaten).                  -->
<!-- ============================================================= -->
<div class="v2-lake" style="position: relative; width: 240px; height: 240px;" title="Klick = erneut abspielen">

    <style>
        .v2-lake { --v2-cycle: 4.8s; cursor: pointer; }

        /* ===== 1) SEE-GRUNDWELLEN (aus See-Snippet) ===== */
        .v2-lake .v2-ring-1 { animation: v2lr1 var(--v2-cycle) alternate ease-in-out infinite; fill: #52A8B6; }
        @keyframes v2lr1 { 0%{d:path('M105,30 C155,30 180,60 180,90 C180,125 150,150 105,150 C60,150 30,125 30,90 C30,60 55,30 105,30 Z');} 100%{d:path('M105,35 C150,30 185,65 175,95 C165,125 145,145 105,145 C65,145 40,125 35,95 C30,65 60,40 105,35 Z');} }
        .v2-lake .v2-ring-2 { animation: v2lr2 var(--v2-cycle) alternate ease-in-out infinite; fill: #68BAC4; }
        @keyframes v2lr2 { 0%{d:path('M105,45 C140,45 160,70 160,90 C160,115 135,135 105,135 C70,135 50,115 50,90 C50,70 70,45 105,45 Z');} 100%{d:path('M105,40 C145,45 165,65 165,90 C165,115 140,140 105,140 C65,140 45,120 45,90 C45,65 65,35 105,40 Z');} }
        .v2-lake .v2-ring-3 { animation: v2lr3 var(--v2-cycle) alternate ease-in-out infinite; fill: #81CAD4; }
        @keyframes v2lr3 { 0%{d:path('M105,60 C125,60 140,75 140,90 C140,105 120,120 105,120 C85,120 70,105 70,90 C70,75 85,60 105,60 Z');} 100%{d:path('M105,55 C130,55 145,80 145,95 C145,110 125,125 105,125 C80,125 65,110 65,90 C65,70 80,55 105,55 Z');} }
        .v2-lake .v2-ring-4 { animation: v2lr4 var(--v2-cycle) alternate ease-in-out infinite; fill: #96D5D5; }
        @keyframes v2lr4 { 0%{d:path('M105,70 C115,70 125,80 125,90 C125,100 115,110 105,110 C95,110 85,100 85,90 C85,80 95,70 105,70 Z');} 100%{d:path('M105,75 C115,70 130,85 125,95 C120,105 110,105 105,105 C95,105 80,100 85,90 C90,80 95,80 105,75 Z');} }
        .v2-lake .v2-ring-5 { animation: v2lr5 var(--v2-cycle) alternate ease-in-out infinite; fill: #BCE8E5; }
        @keyframes v2lr5 { 0%{d:path('M105,82 C110,82 112,85 112,90 C112,95 110,98 105,98 C100,98 98,95 98,90 C98,85 100,82 105,82 Z');} 100%{d:path('M105,80 C110,82 115,88 112,92 C109,96 105,95 105,95 C100,95 95,95 97,90 C99,85 100,78 105,80 Z');} }

        /* ===== 2) FALLENDER TROPFEN ===== */
        .v2-lake .v2-drop { transform-box: fill-box; transform-origin: bottom center; animation: v2-fall var(--v2-cycle) ease-in infinite; }
        @keyframes v2-fall {
            0%   { transform: translateY(-155px) scaleY(1.2) scaleX(0.88); opacity: 0; }
            5%   { opacity: 1; }
            26%  { transform: translateY(-6px) scaleY(1.32) scaleX(0.8); opacity: 1; }
            30%  { transform: translateY(0) scaleY(0.5) scaleX(1.4); opacity: 1; }
            35%  { transform: translateY(0) scaleY(0.18) scaleX(1.55); opacity: 0; }
            100% { transform: translateY(0) scaleY(0.18) scaleX(1.55); opacity: 0; }
        }

        /* ===== 3) KRONE (Crown-Splash) — steigt auf, Zacken, sackt zurück ===== */
        .v2-lake .v2-crown {
            transform-box: view-box; transform-origin: 104px 94px;
            fill: none; stroke: #BCE8E5; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
            opacity: 0; animation: v2-crown var(--v2-cycle) cubic-bezier(0.22,1,0.36,1) infinite;
        }
        @keyframes v2-crown {
            0%, 29%  { transform: translateY(6px) scale(0.25); opacity: 0; }
            33%      { transform: translateY(0)   scale(0.7);  opacity: 1; }
            40%      { transform: translateY(-4px) scale(1.05); opacity: 1; }   /* Krone voll aufgerichtet */
            50%      { transform: translateY(-2px) scale(1.1);  opacity: 0.6; }
            60%      { transform: translateY(3px)  scale(0.9);  opacity: 0; }   /* sackt zurück */
            100%     { transform: translateY(3px)  scale(0.9);  opacity: 0; }
        }

        /* ===== 4) SEKUNDÄRTROPFEN — Bogenwurf hoch & zurück ===== */
        .v2-lake .v2-fleck { transform-box: view-box; transform-origin: 104px 92px; fill: #BCE8E5; opacity: 0; }
        .v2-lake .v2-f1 { animation: v2f1 var(--v2-cycle) cubic-bezier(0.3,0.7,0.4,1) infinite; }
        .v2-lake .v2-f2 { animation: v2f2 var(--v2-cycle) cubic-bezier(0.3,0.7,0.4,1) infinite; }
        .v2-lake .v2-f3 { animation: v2f3 var(--v2-cycle) cubic-bezier(0.3,0.7,0.4,1) infinite; }
        .v2-lake .v2-f4 { animation: v2f4 var(--v2-cycle) cubic-bezier(0.3,0.7,0.4,1) infinite; }
        .v2-lake .v2-f5 { animation: v2f5 var(--v2-cycle) cubic-bezier(0.3,0.7,0.4,1) infinite; }
        /* Bogen: hoch-raus (Peak) dann runter-zurück in den See */
        @keyframes v2f1 { 0%,30%{transform:translate(0,0) scale(0.3);opacity:0;} 34%{opacity:1;} 45%{transform:translate(-22px,-24px) scale(1);opacity:1;} 60%{transform:translate(-30px,6px) scale(0.6);opacity:0;} 100%{opacity:0;} }
        @keyframes v2f2 { 0%,30%{transform:translate(0,0) scale(0.3);opacity:0;} 34%{opacity:1;} 46%{transform:translate(20px,-27px) scale(1.1);opacity:1;} 61%{transform:translate(28px,4px) scale(0.6);opacity:0;} 100%{opacity:0;} }
        @keyframes v2f3 { 0%,31%{transform:translate(0,0) scale(0.3);opacity:0;} 35%{opacity:1;} 47%{transform:translate(-10px,-32px) scale(0.9);opacity:1;} 62%{transform:translate(-14px,-2px) scale(0.5);opacity:0;} 100%{opacity:0;} }
        @keyframes v2f4 { 0%,31%{transform:translate(0,0) scale(0.3);opacity:0;} 36%{opacity:1;} 48%{transform:translate(9px,-34px) scale(0.9);opacity:1;} 63%{transform:translate(13px,-3px) scale(0.5);opacity:0;} 100%{opacity:0;} }
        @keyframes v2f5 { 0%,32%{transform:translate(0,0) scale(0.3);opacity:0;} 37%{opacity:1;} 49%{transform:translate(2px,-38px) scale(0.8);opacity:1;} 64%{transform:translate(3px,-6px) scale(0.45);opacity:0;} 100%{opacity:0;} }

        /* ===== 5) REBOUND-TROPFEN (Milk-Crown Mitteltropfen) ===== */
        .v2-lake .v2-rebound { transform-box: view-box; transform-origin: 104px 92px; fill: url(#v2-drop-fill); opacity: 0;
            animation: v2-rebound var(--v2-cycle) cubic-bezier(0.3,0.6,0.4,1) infinite; }
        @keyframes v2-rebound {
            0%, 46% { transform: translateY(0) scale(0.2); opacity: 0; }
            50%     { transform: translateY(-4px) scale(0.8); opacity: 1; }
            60%     { transform: translateY(-26px) scale(1); opacity: 1; }   /* Gipfel */
            72%     { transform: translateY(-4px) scale(0.9); opacity: 1; }
            78%     { transform: translateY(2px) scale(0.5); opacity: 0; }    /* taucht ein */
            100%    { transform: translateY(2px) scale(0.5); opacity: 0; }
        }

        /* ===== 6) EINSCHLAG-RINGE ===== */
        .v2-lake .v2-ripple { transform-box: view-box; transform-origin: 104px 92px; fill: none; opacity: 0; }
        .v2-lake .v2-ra { stroke: #BCE8E5; stroke-width: 2.6; animation: v2-ripple var(--v2-cycle) ease-out infinite; }
        .v2-lake .v2-rb { stroke: #96D5D5; stroke-width: 2.0; animation: v2-ripple var(--v2-cycle) ease-out infinite; animation-delay: -0.2s; }
        @keyframes v2-ripple { 0%,31%{transform:scale(0.12);opacity:0;} 36%{opacity:1;} 70%{transform:scale(1.2);opacity:0;} 100%{transform:scale(1.2);opacity:0;} }

        /* ===== 7) REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            .v2-lake [class*="v2-ring"], .v2-lake .v2-drop, .v2-lake .v2-crown,
            .v2-lake .v2-fleck, .v2-lake .v2-rebound, .v2-lake .v2-ripple { animation: none !important; }
            .v2-lake .v2-drop, .v2-lake .v2-crown, .v2-lake .v2-fleck,
            .v2-lake .v2-rebound, .v2-lake .v2-ripple { opacity: 0; }
        }
    </style>

    <svg viewBox="0 0 200 200" width="100%" height="100%">
        <defs>
            <clipPath id="v2-blob-clip">
                <path d="M 40 100 C 10 50, 70 20, 100 40 C 140 10, 190 50, 170 90 C 190 140, 150 180, 110 160 C 70 190, 20 150, 40 100 Z" />
            </clipPath>
            <filter id="v2-shadow-blur"><feGaussianBlur stdDeviation="3" /></filter>
            <radialGradient id="v2-drop-fill" cx="38%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#BCE8E5" />
                <stop offset="55%" stop-color="#68BAC4" />
                <stop offset="100%" stop-color="#4395A7" />
            </radialGradient>
        </defs>

        <path d="M 40 100 C 10 50, 70 20, 100 40 C 140 10, 190 50, 170 90 C 190 140, 150 180, 110 160 C 70 190, 20 150, 40 100 Z"
              fill="none" stroke="#DDB98B" stroke-width="18" stroke-linejoin="round" />

        <g clip-path="url(#v2-blob-clip)">
            <rect width="200" height="200" fill="#4395A7" />

            <path class="v2-ring-1" d="M105,30 C155,30 180,60 180,90 C180,125 150,150 105,150 C60,150 30,125 30,90 C30,60 55,30 105,30 Z"></path>
            <path class="v2-ring-2" d="M105,45 C140,45 160,70 160,90 C160,115 135,135 105,135 C70,135 50,115 50,90 C50,70 70,45 105,45 Z"></path>
            <path class="v2-ring-3" d="M105,60 C125,60 140,75 140,90 C140,105 120,120 105,120 C85,120 70,105 70,90 C70,75 85,60 105,60 Z"></path>
            <path class="v2-ring-4" d="M105,70 C115,70 125,80 125,90 C125,100 115,110 105,110 C95,110 85,100 85,90 C85,80 95,70 105,70 Z"></path>
            <path class="v2-ring-5" d="M105,82 C110,82 112,85 112,90 C112,95 110,98 105,98 C100,98 98,95 98,90 C98,85 100,82 105,82 Z"></path>

            <!-- Einschlag-Ringe -->
            <ellipse class="v2-ripple v2-ra" cx="104" cy="92" rx="48" ry="35"></ellipse>
            <ellipse class="v2-ripple v2-rb" cx="104" cy="92" rx="48" ry="35"></ellipse>

            <!-- Innerer Uferschatten -->
            <path d="M 40 100 C 10 50, 70 20, 100 40 C 140 10, 190 50, 170 90 C 190 140, 150 180, 110 160 C 70 190, 20 150, 40 100 Z"
                  fill="none" stroke="rgba(38,62,36,0.6)" stroke-width="12" filter="url(#v2-shadow-blur)"/>
        </g>

        <!-- Splash-Ebene über dem Wasser (nicht beschnitten, damit Krone/Tropfen frei fliegen) -->
        <!-- Krone: gezackter, offener Ring -->
        <path class="v2-crown"
              d="M83,96 L86,84 L90,94 L94,80 L99,93 L104,78 L109,93 L114,80 L118,94 L122,84 L125,96"></path>

        <!-- Sekundärtropfen -->
        <ellipse class="v2-fleck v2-f1" cx="104" cy="92" rx="2.6" ry="3.2"></ellipse>
        <ellipse class="v2-fleck v2-f2" cx="104" cy="92" rx="2.8" ry="3.4"></ellipse>
        <ellipse class="v2-fleck v2-f3" cx="104" cy="92" rx="2.2" ry="2.8"></ellipse>
        <ellipse class="v2-fleck v2-f4" cx="104" cy="92" rx="2.2" ry="2.8"></ellipse>
        <ellipse class="v2-fleck v2-f5" cx="104" cy="92" rx="2.0" ry="2.6"></ellipse>

        <!-- Rebound-Mitteltropfen (Milk-Crown) -->
        <path class="v2-rebound" transform="translate(104 92)"
              d="M0,4 C3.2,-1 5,-3 5,-6.5 A5,5 0 1 0 -5,-6.5 C-5,-3 -3.2,-1 0,4 Z"></path>

        <!-- Fallender Haupttropfen -->
        <g transform="translate(104 92)">
            <path class="v2-drop" fill="url(#v2-drop-fill)" stroke="#4395A7" stroke-width="0.6"
                  d="M0,0 C5,-8 8,-11 8,-16 A8,8 0 1 0 -8,-16 C-8,-11 -5,-8 0,0 Z"></path>
            <ellipse class="v2-drop" cx="-3" cy="-17" rx="2.4" ry="3.2" fill="#EFFAF8" opacity="0.85"></ellipse>
        </g>
    </svg>

    <script>
        (function () {
            var lake = document.currentScript.closest('.v2-lake');
            if (!lake) return;
            lake.addEventListener('click', function () {
                lake.querySelectorAll('.v2-drop, .v2-crown, .v2-fleck, .v2-rebound, .v2-ripple').forEach(function (el) {
                    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
                });
            });
        })();
    </script>
</div>

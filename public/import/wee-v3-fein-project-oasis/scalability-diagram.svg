<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="scale-title">
  <title id="scale-title">Diagramm: Skalierung von einer kleinen Einheit über Cluster zu einem größeren Netzwerk</title>
  <defs>
    <radialGradient id="scale-bg" cx="20%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#1E4530" />
      <stop offset="70%" stop-color="#0E2117" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#scale-bg)" />

  <!-- Flow-Pfeile zwischen den drei Stufen -->
  <g stroke="#8FBF64" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="3 6" fill="none">
    <path d="M170 300 L288 300" />
    <path d="M472 300 L523 297" />
  </g>
  <g fill="#8FBF64" fill-opacity="0.7">
    <path d="M288 300 L278 295 L278 305 Z" />
    <path d="M523 297 L513 292.5 L512.5 302.4 Z" />
  </g>

  <!-- Stufe 1: kleine Einheit -->
  <g>
    <circle cx="120" cy="300" r="45" fill="none" stroke="#72AC43" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 6" />
    <circle cx="120" cy="300" r="18" fill="#8FBF64" />
    <circle cx="120" cy="300" r="7" fill="#D0E4BA" fill-opacity="0.75" />
  </g>

  <!-- Stufe 2: Cluster (Hub + 6 verbundene Einheiten) -->
  <g stroke="#B0D38C" stroke-opacity="0.45" stroke-width="1.3">
    <line x1="380" y1="300" x2="430" y2="300" />
    <line x1="380" y1="300" x2="405" y2="257.7" />
    <line x1="380" y1="300" x2="355" y2="257.7" />
    <line x1="380" y1="300" x2="330" y2="300" />
    <line x1="380" y1="300" x2="355" y2="342.3" />
    <line x1="380" y1="300" x2="405" y2="342.3" />
  </g>
  <g stroke="#8FBF64" stroke-opacity="0.28" stroke-width="1">
    <line x1="430" y1="300" x2="405" y2="257.7" />
    <line x1="405" y1="257.7" x2="355" y2="257.7" />
    <line x1="355" y1="257.7" x2="330" y2="300" />
    <line x1="330" y1="300" x2="355" y2="342.3" />
    <line x1="355" y1="342.3" x2="405" y2="342.3" />
    <line x1="405" y1="342.3" x2="430" y2="300" />
  </g>
  <circle cx="380" cy="300" r="85" fill="none" stroke="#72AC43" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 6" />
  <circle cx="380" cy="300" r="13" fill="#8FBF64" />
  <g fill="#B0D38C">
    <circle cx="430" cy="300" r="9" />
    <circle cx="405" cy="257.7" r="9" />
    <circle cx="355" cy="257.7" r="9" />
    <circle cx="330" cy="300" r="9" />
    <circle cx="355" cy="342.3" r="9" />
    <circle cx="405" cy="342.3" r="9" />
  </g>

  <!-- Stufe 3: größeres Netzwerk (dichtes Mesh) -->
  <g stroke="#B0D38C" stroke-opacity="0.4" stroke-width="1.2">
    <line x1="660" y1="290" x2="700" y2="210" />
    <line x1="660" y1="290" x2="570" y2="275" />
    <line x1="660" y1="290" x2="580" y2="355" />
    <line x1="660" y1="290" x2="635" y2="400" />
    <line x1="660" y1="290" x2="715" y2="300" />
    <line x1="700" y1="210" x2="610" y2="205" />
    <line x1="700" y1="210" x2="745" y2="265" />
    <line x1="715" y1="300" x2="745" y2="265" />
    <line x1="745" y1="265" x2="760" y2="340" />
    <line x1="715" y1="300" x2="760" y2="340" />
    <line x1="760" y1="340" x2="705" y2="395" />
    <line x1="705" y1="395" x2="635" y2="400" />
    <line x1="635" y1="400" x2="580" y2="355" />
    <line x1="580" y1="355" x2="570" y2="275" />
    <line x1="570" y1="275" x2="610" y2="205" />
    <line x1="610" y1="205" x2="700" y2="210" />
    <line x1="715" y1="300" x2="705" y2="395" />
  </g>
  <circle cx="660" cy="290" r="130" fill="none" stroke="#72AC43" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 6" />
  <circle cx="660" cy="290" r="14" fill="#8FBF64" />
  <circle cx="715" cy="300" r="7" fill="#B0D38C" />
  <g fill="#B0D38C" fill-opacity="0.9">
    <circle cx="700" cy="210" r="8" />
    <circle cx="745" cy="265" r="9" />
    <circle cx="760" cy="340" r="8" />
    <circle cx="705" cy="395" r="9" />
    <circle cx="635" cy="400" r="8" />
    <circle cx="580" cy="355" r="9" />
    <circle cx="570" cy="275" r="8" />
    <circle cx="610" cy="205" r="7" />
  </g>

  <!-- Beschriftung der drei Stufen -->
  <g font-family="system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="1.5" fill="#CBD2CD" fill-opacity="0.85" text-anchor="middle">
    <text x="120" y="382">EINHEIT</text>
    <text x="380" y="422">CLUSTER</text>
    <text x="660" y="457">NETZWERK</text>
  </g>
</svg>

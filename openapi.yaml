# openapi.yaml — Vertrag der Autoren-API des Flowcode-Builders.
#
# DREIFACHE ROLLE (docs/agent-schnittstelle.md §5, Schritt 4):
#   1. Menschen-Doku der Autoren-API (next dev, Port 3113, NUR 127.0.0.1)
#   2. --spec-Input fuer Printing Press (druckt CLI + MCP-Server daraus)
#   3. Diff-Anker fuer Reprints (API-Aenderung => Spec-Aenderung => Reprint)
#
# WICHTIG: Diese API existiert NUR auf der Autoren-Maschine unter `next dev`
# (output:"export" — im Deploy gibt es keine Routen). Kein Auth-Layer noetig;
# CSRF-Schutz via Origin-Gate (lib/api/server-helfer.ts), Bind auf Loopback.
# Alle Operationen sind POST — output:"export" wuerde GET-Routen statisch
# vorrendern (s. app/api/assets/route.ts, Kopfkommentar).

openapi: 3.0.3
info:
  title: Flowcode Builder Autoren-API
  description: >-
    Lokale Autoren-API des flowcode-website-builder (Next.js Dev-Server).
    Bedient von Menschen (Editor-UI), printed CLIs/MCP-Servern (Printing
    Press) und Agenten (Claude Code, Paperclip-Worker). Schreibende
    Operationen sind explizit; der Import ist dry-run-by-default.
  version: "1.0.0"
  x-auth-type: none
  x-runtime: "next dev only (127.0.0.1:3113) — nicht im Static-Export-Deploy"
servers:
  - url: http://127.0.0.1:3113
    description: Lokaler Dev-Server (Autoren-Maschine)

paths:
  /api/builder/status:
    post:
      operationId: builderStatus
      summary: Health/Discovery (doctor-Ziel)
      description: Name, Version, API-Version, registrierte Puck-Komponenten-Typen, Routenliste.
      responses:
        "200":
          description: Builder erreichbar
          content:
            application/json:
              schema:
                type: object
                required: [name, version, apiVersion, zeit, komponentenTypen, routen]
                properties:
                  name: { type: string }
                  version: { type: string }
                  apiVersion: { type: integer }
                  zeit: { type: string, format: date-time }
                  komponentenTypen:
                    type: array
                    items: { type: string }
                  routen:
                    type: array
                    items: { type: string }
        "403": { $ref: "#/components/responses/FremderUrsprung" }

  /api/puck-seite/liste:
    post:
      operationId: puckSeiteListe
      summary: Gespeicherte Puck-Seiten auflisten
      responses:
        "200":
          description: Liste (neueste zuerst)
          content:
            application/json:
              schema:
                type: object
                required: [seiten]
                properties:
                  seiten:
                    type: array
                    items: { $ref: "#/components/schemas/SeitenInfo" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }

  /api/puck-seite/lade:
    post:
      operationId: puckSeiteLade
      summary: Eine Puck-Seite laden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/SeitenName" }
      responses:
        "200":
          description: Seite
          content:
            application/json:
              schema:
                type: object
                required: [name, gespeichert, version, data]
                properties:
                  name: { type: string }
                  gespeichert: { type: string }
                  version: { type: integer }
                  data: { $ref: "#/components/schemas/PuckData" }
                  anim: { $ref: "#/components/schemas/SeitenAnim" }
                  styles:
                    type: array
                    items: { type: string }
                    description: >-
                      Welle 5a — uebernommene Stylesheet-URLs (public/import/<slug>/css/…),
                      falls die Seite welche hat. Bühne/Puck-Render/Vorschau injizieren
                      sie gescoped.
        "400": { $ref: "#/components/responses/Ungueltig" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /api/puck-seite/speichere:
    post:
      operationId: puckSeiteSpeichere
      summary: Eine Puck-Seite schreiben (konflikt-geschuetzt)
      description: >-
        Schreibt seiten/<name>.json. Existiert die Seite bereits, muss
        erwartetGespeichert dem aktuellen Stand entsprechen ODER
        ueberschreibe=true gesetzt sein — sonst 409 (agentensicheres
        Konflikt-Modell). data wird strukturgeprueft, auf registrierte
        Komponenten-Typen geklemmt und durch Pucks migrate() gehoben.
        409 auch, wenn die Seite zwischenzeitlich GELOESCHT wurde und der
        Aufrufer erwartetGespeichert mitschickt (N18): dann keine stumme
        Neuanlage, sondern Konflikt — ueberschreibe:true legt sie neu an.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, data]
              properties:
                name: { $ref: "#/components/schemas/SeitenName" }
                data: { $ref: "#/components/schemas/PuckData" }
                erwartetGespeichert:
                  type: string
                  description: Der dem Aufrufer bekannte gespeichert-Zeitstempel.
                ueberschreibe:
                  type: boolean
                  default: false
                anim:
                  allOf:
                    - $ref: "#/components/schemas/SeitenAnim"
                  description: >-
                    Welle 4c — optionales Animations-Abbild (Scroll-Grafiken des
                    Animators ueber dieser Seite). Gesetzt → wird geschrieben;
                    weggelassen → ein bereits an der Seite haengendes anim bleibt
                    erhalten (ein reiner Daten-Speichervorgang loescht es nicht).
                styles:
                  type: array
                  items: { type: string }
                  description: >-
                    Welle 5a — uebernommene Stylesheet-URLs (nur root-relative
                    /import/…-Pfade erlaubt). Gleiche Erhaltungs-Semantik wie
                    anim: gesetzt → wird geschrieben; weggelassen → bestehendes
                    styles bleibt erhalten.
      responses:
        "200":
          description: Geschrieben
          content:
            application/json:
              schema:
                type: object
                required: [name, pfad, gespeichert, contentAnzahl]
                properties:
                  name: { type: string }
                  pfad: { type: string }
                  gespeichert: { type: string }
                  contentAnzahl: { type: integer }
        "400": { $ref: "#/components/responses/Ungueltig" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }
        "409":
          description: >-
            Konflikt — Seite wurde zwischenzeitlich geaendert ODER geloescht
            (N18: erwartetGespeichert gesetzt, Datei aber weg).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fehler" }

  /api/puck-seite/loesche:
    post:
      operationId: puckSeiteLoesche
      summary: Eine Puck-Seite in den Papierkorb verschieben (reversibel)
      description: >-
        Loeschen ist reversibel (N2): die Seite wird nicht hart entfernt,
        sondern nach seiten/.papierkorb/<name>-<zeitstempel>.json verschoben.
        Zurueckholen ueber /api/puck-seite/wiederherstelle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/SeitenName" }
      responses:
        "200":
          description: In den Papierkorb verschoben
          content:
            application/json:
              schema:
                type: object
                required: [name, geloescht]
                properties:
                  name: { type: string }
                  geloescht: { type: boolean }
                  papierkorb:
                    type: string
                    description: >-
                      Dateiname im Papierkorb (<name>-<zeitstempel>.json) —
                      fuer Undo/Logs.
        "403": { $ref: "#/components/responses/FremderUrsprung" }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /api/puck-seite/wiederherstelle:
    post:
      operationId: puckSeiteWiederherstelle
      summary: Eine geloeschte Puck-Seite aus dem Papierkorb zurueckholen
      description: >-
        Stellt die JUENGSTE Papierkorb-Fassung der Seite wieder her (N2).
        404, wenn nichts im Papierkorb liegt; 409, wenn die Ziel-Seite
        inzwischen wieder existiert (kein blindes Ueberschreiben, R-e).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/SeitenName" }
      responses:
        "200":
          description: Wiederhergestellt
          content:
            application/json:
              schema:
                type: object
                required: [name, pfad, gespeichert, wiederhergestellt]
                properties:
                  name: { type: string }
                  pfad: { type: string }
                  gespeichert: { type: string }
                  wiederhergestellt: { type: boolean }
        "403": { $ref: "#/components/responses/FremderUrsprung" }
        "404": { $ref: "#/components/responses/NichtGefunden" }
        "409":
          description: Ziel-Seite existiert bereits — nicht ueberschrieben
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fehler" }

  /api/import/grafik-setup:
    post:
      operationId: importGrafikSetup
      summary: "Importer Stufe A: GrafikSetup deterministisch nach Puck uebersetzen"
      description: >-
        Deterministischer Adapter (lib/import/grafik-setup-to-puck.ts) als
        Endpunkt. Quelle ist entweder ein GrafikSetup im Body oder ein
        gespeichertes Abbild (abbilder/<abbildName>.json). DRY-RUN BY
        DEFAULT — geschrieben wird nur mit dryRun=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setup: { $ref: "#/components/schemas/GrafikSetup" }
                abbildName: { $ref: "#/components/schemas/SeitenName" }
                zielSeite: { $ref: "#/components/schemas/SeitenName" }
                dryRun:
                  type: boolean
                  default: true
                erwartetGespeichert: { type: string }
                ueberschreibe: { type: boolean, default: false }
      responses:
        "200":
          description: Import-Bericht (bei dryRun=false inkl. pfad/gespeichert)
          content:
            application/json:
              schema:
                type: object
                required: [quelle, zielSeite, grafikenAnzahl, contentAnzahl, typen, dryRun]
                properties:
                  quelle: { type: string }
                  zielSeite: { type: string }
                  grafikenAnzahl: { type: integer }
                  contentAnzahl: { type: integer }
                  typen:
                    type: array
                    items: { type: string }
                  dryRun: { type: boolean }
                  pfad: { type: string }
                  gespeichert: { type: string }
        "400": { $ref: "#/components/responses/Ungueltig" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }
        "404": { $ref: "#/components/responses/NichtGefunden" }
        "409":
          description: Konflikt mit bestehender Ziel-Seite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fehler" }

  /api/import/asset:
    post:
      operationId: importAsset
      summary: "Ordner-Import: grosses Bild-Asset nach public/import/<slug>/ kopieren"
      description: >-
        Welle 4b. Der Client bettet kleine Bilder (<300 KB) als Data-URL in die
        Seite ein; groessere Assets aus dem importierten Ordner landen
        hierueber als echte Datei unter public/import/<slug>/<name>. Guards wie
        /api/assets aktion=schreibe: Origin-Gate, Pfad-Guards (kein Ausbruch aus
        public/import/), Groessenlimit (8 MB), Endungs-Whitelist (Bild).
        Welle 5a: zusaetzlich .css erlaubt (dann data:text/css und Ablage unter
        public/import/<slug>/css/) — Endung↔MIME sind eng gekoppelt.
        I6 (Schritt VI): aktion="leeren" leert den Asset-Ordner eines Slugs
        REVERSIBEL (Verschieben nach public/import/.papierkorb/<slug>-<ts>/) —
        gegen Waisen aus einem frueheren Import vor einem Re-Import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [slug, name, dataUrl]
                  description: "Default (aktion=schreibe): Asset kopieren."
                  properties:
                    slug: { $ref: "#/components/schemas/SeitenName" }
                    name:
                      type: string
                      description: Reiner Ziel-Dateiname mit Bild-, Font-, Medien- oder .css-Endung.
                    dataUrl: { type: string, description: "data:image/...;base64,... oder data:text/css;base64,... (Welle 5a)" }
                - type: object
                  required: [aktion, slug]
                  description: "I6: Asset-Ordner des Slugs reversibel leeren."
                  properties:
                    aktion: { type: string, enum: [leeren] }
                    slug: { $ref: "#/components/schemas/SeitenName" }
      responses:
        "200":
          description: Geschrieben (schreibe) bzw. geleert (leeren)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [slug, name, pfad, url]
                    properties:
                      slug: { type: string }
                      name: { type: string }
                      pfad: { type: string }
                      url: { type: string }
                  - type: object
                    required: [slug, aktion, geleert, dateien]
                    properties:
                      slug: { type: string }
                      aktion: { type: string, enum: [leeren] }
                      geleert: { type: boolean }
                      dateien: { type: integer }
                      verschobenNach: { type: string }
        "400": { $ref: "#/components/responses/Ungueltig" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }

  /api/import/freeze:
    post:
      operationId: importFreeze
      summary: "Import-Endlevel E4: Seite(n) serverseitig einfrieren (Playwright)"
      description: >-
        Dev-only (I6/E4, docs/plan-webbuilder-umbau-gesamt.md E4). Fuehrt die
        I1-Freeze-Kernlogik (scripts/freeze-seite.mjs) serverseitig aus, damit
        der UI-Ordner-Import dieselbe Freeze-Qualitaet wie das Skript bekommt:
        die Seite wird mit System-Chrome gerendert, Entrance-/Lazy-Animationen
        in den Endzustand getrieben (getAnimations().finish()) und der SICHTBARE
        End-DOM abgegriffen (0x opacity:0 an Texttraegern, M4). Quelle ist
        entweder ein Direktpfad (ordnerPfad, Agent/CLI) ODER hochgereichte
        Ordner-Inhalte (dateien, UI — werden in einen Temp-Ordner materialisiert
        und danach aufgeraeumt). Playwright laeuft als externer Kindprozess, nie
        im Produktkern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Genau eines von ordnerPfad | dateien angeben."
              properties:
                ordnerPfad:
                  type: string
                  description: Direktpfad zu einem out/-Ordner auf der Autoren-Maschine.
                dateien:
                  type: array
                  description: Hochgereichte Ordner-Inhalte (UI-Weg).
                  items:
                    type: object
                    required: [pfad]
                    properties:
                      pfad: { type: string, description: Relativer Pfad im Ordner. }
                      dataUrl: { type: string, description: "data:...;base64,... (Binaerdateien)." }
                      text: { type: string, description: Text-Inhalt (Alternative zu dataUrl). }
                seiten:
                  type: array
                  items: { type: string }
                  description: >-
                    Seiten-Pfade (".", "bildung", "bildung/aquaponik"). Default ["."].
      responses:
        "200":
          description: Freeze-Ergebnis je Seite
          content:
            application/json:
              schema:
                type: object
                required: [modus, seiten]
                properties:
                  modus: { type: string, enum: [ordnerPfad, dateien] }
                  seiten:
                    type: array
                    items:
                      type: object
                      required: [seite, slug, ok]
                      properties:
                        seite: { type: string }
                        slug: { type: string }
                        ok: { type: boolean }
                        html:
                          type: string
                          description: Gefrorene self-contained End-HTML (bei ok=true).
                        protokoll:
                          type: object
                          description: Freeze-Protokoll (opacityVorher/Nachher, Dauer, Marker).
                        fehler: { type: string }
        "400": { $ref: "#/components/responses/Ungueltig" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }

  /api/export/ordner:
    post:
      operationId: exportOrdner
      summary: "Station 4 / S2: Ordner-Struktur-Export nach export/<slug>/ schreiben"
      description: >-
        Materialisiert das vom Client (components/embed/ordner-export.ts,
        baueOrdnerArtefakt "ordner") fertig zusammengebaute Artefakt als
        deploybaren Rohbau unter export/<slug>/ (Projektwurzel, gitignored).
        Der Server baut NICHTS an Puck (kein puck.config-Import) — er schreibt
        nur reine Dateien. Guards wie /api/import/asset: Origin-Gate,
        Pfad-Guards (kein Ausbruch aus export/<slug>/; Kopier-Quellen nur aus
        public/), Endungs↔MIME-Whitelist eng gekoppelt, Groessenlimits.
        Je Datei GENAU EINE Quelle: inhalt (Text) ODER quellUrl (data:-URL →
        dekodieren, oder /import|/curtain|/vektor-Pfad → aus public/ kopieren).
        Die Aliase dataUrl (nur data:) und quellPfad (nur /…) werden zusaetzlich
        akzeptiert. Zwei-Pass: erst alle Eintraege validieren, dann schreiben —
        ein ungueltiger Eintrag hinterlaesst keinen halben Ordner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, dateien]
              properties:
                slug: { $ref: "#/components/schemas/SeitenName" }
                spiegel:
                  type: boolean
                  description: >-
                    Optional true → zusaetzlich public/export/<slug>/ schreiben
                    (statisch ausgelieferter Vorschau-Spiegel fuer Station 4).
                    Default false (nur export/<slug>/).
                leeren:
                  type: boolean
                  description: >-
                    Optional true → Clean-Write: den Ziel-Ordner export/<slug>/
                    (und, falls spiegel, public/export/<slug>/) VOR dem Schreiben
                    komplett leeren, damit Altlasten eines frueheren Exports
                    (verwaiste Assets, Seiten geloeschter Slugs) nicht
                    akkumulieren. Geleert wird erst NACH der Validierung und nur
                    innerhalb der ausbruchsgeprueften Wurzeln. Default false.
                dateien:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [pfad]
                    description: "GENAU eine Quelle: inhalt ODER quellUrl (bzw. dataUrl/quellPfad)."
                    properties:
                      pfad:
                        type: string
                        maxLength: 400
                        description: >-
                          Ziel-Pfad relativ zu export/<slug>/ (darf Unterordner
                          enthalten: index.html, ueber-uns/index.html,
                          assets/<hash>.png, css/x.css). Kein ".."/absolut/
                          Laufwerk. Endung muss auf der Whitelist stehen
                          (html/js/css/txt/json, Bilder, Fonts, Medien).
                      inhalt:
                        type: string
                        description: Fertiger Text (nur html/js/css/txt/json).
                      quellUrl:
                        type: string
                        description: >-
                          "data:…;base64,…" → dekodieren + schreiben, oder
                          "/import…|/curtain…|/vektor…" → aus public/ kopieren.
                      dataUrl:
                        type: string
                        description: Alias fuer quellUrl (nur data:), falls quellUrl fehlt.
                      quellPfad:
                        type: string
                        description: Alias fuer quellUrl (nur /…), falls quellUrl fehlt.
      responses:
        "200":
          description: Ordner geschrieben
          content:
            application/json:
              schema:
                type: object
                required: [slug, ordner, anzahl, dateien]
                properties:
                  slug: { type: string }
                  ordner: { type: string, description: "Relativer Ziel-Ordner (export/<slug>)." }
                  anzahl: { type: integer }
                  dateien:
                    type: array
                    items:
                      type: object
                      required: [pfad, bytes]
                      properties:
                        pfad: { type: string }
                        bytes: { type: integer }
        "400": { $ref: "#/components/responses/Ungueltig" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }

  /api/abbild:
    post:
      operationId: abbildAktion
      summary: "Bestand: Abbilder des Grafik-Editors (aktion-Dispatch)"
      description: >-
        Historische Sammel-Route des Grafik-Editors (app/api/abbild/route.ts).
        Aktionen: liste | lade | speichere | loesche | standard ("Als
        Standard setzen" schreibt grafik.config.json).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [aktion]
                  properties:
                    aktion: { type: string, enum: [liste] }
                - type: object
                  required: [aktion, name]
                  properties:
                    aktion: { type: string, enum: [lade, loesche] }
                    name: { $ref: "#/components/schemas/SeitenName" }
                - type: object
                  required: [aktion, name, abbild]
                  properties:
                    aktion: { type: string, enum: [speichere] }
                    name: { $ref: "#/components/schemas/SeitenName" }
                    abbild: { $ref: "#/components/schemas/GrafikSetup" }
                - type: object
                  required: [aktion, abbild]
                  properties:
                    aktion: { type: string, enum: [standard] }
                    abbild: { $ref: "#/components/schemas/GrafikSetup" }
      responses:
        "200":
          description: Aktionsabhaengige Antwort (liste/lade/speichere/loesche/standard)
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Ungueltig" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }
        "404": { $ref: "#/components/responses/NichtGefunden" }

  /api/assets:
    post:
      operationId: assetsAktion
      summary: "Bestand: Asset-Bibliothek aus public/ (aktion-Dispatch)"
      description: >-
        aktion=liste (Default bei jeder anderen Eingabe) listet public/
        rekursiv; aktion=schreibe legt eine Base64-Data-URL als Datei unter
        public/vektor/ ab (fuer vektorisierte SVGs).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    aktion: { type: string, enum: [liste] }
                - type: object
                  required: [aktion, name, dataUrl]
                  properties:
                    aktion: { type: string, enum: [schreibe] }
                    name: { type: string }
                    dataUrl: { type: string, description: "data:image/...;base64,..." }
      responses:
        "200":
          description: Asset-Liste bzw. Schreibbestaetigung
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Ungueltig" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }

  /api/vektorisieren:
    post:
      operationId: vektorisieren
      summary: "Bestand: Raster→SVG-Vektorisierer (deterministisch, kein ML)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataUrl]
              properties:
                dataUrl: { type: string, description: "data:image/...;base64,..." }
                optionen: { type: object, description: "VektorOptionen (components/vektor/vektorisieren.ts)" }
      responses:
        "200":
          description: SVG-Ergebnis
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Ungueltig" }
        "403": { $ref: "#/components/responses/FremderUrsprung" }

components:
  responses:
    Ungueltig:
      description: Ungueltige Eingabe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Fehler" }
    NichtGefunden:
      description: Nicht gefunden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Fehler" }
    FremderUrsprung:
      description: CSRF-Gate — fremder Browser-Origin abgelehnt
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Fehler" }

  schemas:
    Fehler:
      type: object
      required: [fehler]
      properties:
        fehler: { type: string }

    SeitenName:
      type: string
      maxLength: 100
      description: >-
        Reiner Dateinamen-Baustein (kein Pfad, kein "..", keine
        Windows-Sonderzeichen; Unicode-Buchstaben erlaubt) — Sanitisierung
        in lib/api/server-helfer.ts (saubererName).

    SeitenInfo:
      type: object
      required: [name, gespeichert, contentAnzahl]
      properties:
        name: { type: string }
        gespeichert: { type: string }
        contentAnzahl: { type: integer }

    PuckData:
      type: object
      required: [content]
      description: >-
        Puck-Datenmodell (flach; Slots sind Props vom Typ ComponentData[]).
        Nur in lib/puck-registry.ts registrierte Typen ueberleben das
        Server-Gate.
      properties:
        root: { type: object }
        content:
          type: array
          items: { $ref: "#/components/schemas/PuckContentItem" }

    SeitenAnim:
      type: object
      required: [grafiken]
      description: >-
        Welle 4c — Animations-Abbild einer Seite (lib/api/seiten-speicher.ts
        SeitenAnim). Dieselben Grafik-Objekte wie im Abbild-Speicher, hier direkt
        an der Seite gespeichert (eine Datei = Seite + Animation). Struktur-Gate
        ueber die bestehende Grafik-Validierung (istGrafik).
      properties:
        grafiken:
          type: array
          items: { $ref: "#/components/schemas/Grafik" }
        uebernommen:
          type: array
          items: { type: string }

    PuckContentItem:
      type: object
      required: [type, props]
      properties:
        type:
          type: string
          description: Registrierter Komponenten-Typ (z.B. ShapeAccent, GrafikLayer)
        props:
          type: object
          required: [id]
          properties:
            id: { type: string }
          additionalProperties: true

    GrafikKeyframe:
      type: object
      required: [scrollY, x, y, scale, opacity, rotation]
      properties:
        scrollY: { type: number }
        x: { type: number }
        y: { type: number }
        scale: { type: number }
        opacity: { type: number }
        rotation: { type: number }
        easing:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        srcOverride: { type: string }

    Grafik:
      type: object
      required: [id, name, src, art, breitePx, z, keyframes]
      properties:
        id: { type: string }
        name: { type: string }
        src: { type: string }
        art: { type: string, enum: [bild, lottie, video] }
        breitePx: { type: number }
        z: { type: number }
        modus: { type: string, enum: [loop, scrub, still] }
        stumm: { type: boolean }
        versteckt: { type: boolean }
        gesperrt: { type: boolean }
        spiegelX: { type: boolean }
        spiegelY: { type: boolean }
        keyframes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/GrafikKeyframe" }

    GrafikSetup:
      type: object
      required: [grafiken]
      description: Export-Format des Grafik-Editors (components/grafik/grafik-types.ts).
      properties:
        name: { type: string }
        gespeichert: { type: string }
        meta:
          type: object
          properties:
            viewportW: { type: number }
            viewportH: { type: number }
            docH: { type: number }
        grafiken:
          type: array
          items: { $ref: "#/components/schemas/Grafik" }
        pool:
          type: array
          items: { type: object }
        uebernommen:
          type: array
          items: { type: string }
